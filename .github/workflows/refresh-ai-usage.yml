name: Refresh AI usage snapshot

# Keeps the self-metered AI usage figures current by default. Fetches the published dashboard,
# regenerates src/data/ai-usage-snapshot.ts and the index.html no-JS fallback, runs the full
# gate, and commits only when the figures changed. The commit lands on main, which Vercel
# deploys. Nothing is fetched at runtime; the committed snapshot is the artifact.
#
# GITHUB_TOKEN pushes do not trigger ci.yml, so the same checks run here before committing.
#
# Two jobs keep the write token away from third-party code:
# - refresh runs npm ci, the fetch, and the gate with a read-only token that is not
#   persisted to .git/config. It hands off only the two generated files.
# - publish holds contents: write, installs nothing, runs no npm code, and refuses any
#   change outside the snapshot file and the marked index.html paragraph.
# Actions are pinned to full commit SHAs; the trailing comment names the release.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-ai-usage
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch dashboard and regenerate snapshot
        run: npm run refresh:ai-usage
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- src/data/ai-usage-snapshot.ts index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the CI gate on the refreshed snapshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Refuse changes outside the generated files
        if: steps.diff.outputs.changed == 'true'
        run: |
          unexpected=$(git status --porcelain --untracked-files=no | cut -c4- | grep -vxE 'src/data/ai-usage-snapshot\.ts|index\.html' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked changes: $unexpected"
            exit 1
          fi
      - name: Hand off the generated files
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-usage-snapshot
          path: |
            src/data/ai-usage-snapshot.ts
            index.html
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-usage-snapshot
          path: ${{ runner.temp }}/ai-usage-snapshot
      - name: Apply only the snapshot file and the marked paragraph
        env:
          INCOMING: ${{ runner.temp }}/ai-usage-snapshot
        # Runner's preinstalled node, no packages. Rejects anything but the expected shape.
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const dir = process.env.INCOMING;
          const start = "<!-- ai-usage-snapshot:start (rewritten by scripts/fetch-ai-usage.mjs) -->";
          const end = "<!-- ai-usage-snapshot:end -->";
          const split = (html) => {
            const a = html.indexOf(start);
            const b = html.indexOf(end);
            if (a < 0 || b < a) throw new Error("index.html markers missing");
            return [html.slice(0, a + start.length), html.slice(a + start.length, b), html.slice(b)];
          };
          const current = readFileSync("index.html", "utf8");
          const incoming = readFileSync(join(dir, "index.html"), "utf8");
          const [cHead, , cTail] = split(current);
          const [iHead, iBody, iTail] = split(incoming);
          if (cHead !== iHead || cTail !== iTail) throw new Error("index.html changed outside the snapshot markers");
          if (!/^\n {10}<p>Floor figures as of [0-9-]+: [0-9,]+ tokens recovered across \d+ sources, spanning [0-9-]+ through [0-9-]+, at [0-9.]+M exact-metered and [0-9.]+M estimated\.<\/p>\n {10}$/.test(iBody)) {
            throw new Error("index.html snapshot paragraph has an unexpected shape");
          }
          const snapshot = readFileSync(join(dir, "src/data/ai-usage-snapshot.ts"), "utf8");
          const shape = new RegExp([
            String.raw`^// GENERATED by scripts/fetch-ai-usage\.mjs — do not edit by hand\.`,
            String.raw`// Floor values derived from https://sam-rogers\.com/ai-usage/ via (summary\.json|embedded daily record)\.`,
            String.raw`// Refreshed on a schedule by \.github/workflows/refresh-ai-usage\.yml; never fetched at runtime\.`,
            String.raw`export const aiUsageSnapshot = \{`,
            String.raw`  url: "https://sam-rogers\.com/ai-usage/",`,
            String.raw`  asOf: "\d{4}-\d{2}-\d{2}",`,
            String.raw`  firstDate: "\d{4}-\d{2}-\d{2}",`,
            String.raw`  totalTokensRaw: \d+,`,
            String.raw`  totalTokens: "[0-9,]+",`,
            String.raw`  totalTokensShort: "\d+M\+",`,
            String.raw`  exactTokens: "[0-9.]+M",`,
            String.raw`  estimatedTokens: "[0-9.]+M",`,
            String.raw`  percentExact: \d+,`,
            String.raw`  sourceCount: \d+,`,
            String.raw`  sourceLabels: \["[A-Za-z0-9 ()]+"(,"[A-Za-z0-9 ()]+")*\],`,
            String.raw`\} as const;`,
            String.raw`$`,
          ].join("\n"));
          if (!shape.test(snapshot)) throw new Error("ai-usage-snapshot.ts has an unexpected shape");
          writeFileSync("index.html", incoming);
          writeFileSync("src/data/ai-usage-snapshot.ts", snapshot);
          EOF
      - name: Commit and push
        run: |
          unexpected=$(git status --porcelain | cut -c4- | grep -vxE 'src/data/ai-usage-snapshot\.ts|index\.html' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes: $unexpected"
            exit 1
          fi
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ai-usage-snapshot.ts index.html
          AS_OF=$(sed -n 's/^  asOf: "\(.*\)",$/\1/p' src/data/ai-usage-snapshot.ts)
          git commit -m "Refresh AI usage snapshot (as of ${AS_OF})"
          git push origin HEAD:main
